security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 
            algorithm: auto
            cost: 12
    role_hierarchy:
         ROLE_ADMIN:       [ROLE_ADMIN, ROLE_RESPONSABLE, ROLE_AGENT]
         ROLE_RESPONSABLE: [ROLE_RESPONSABLE, ROLE_AGENT]
         ROLE_AGENT:       [ROLE_AGENT]        

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard_redirect
                enable_csrf: true
            
            logout:
                path: app_logout
                target: app_login 
                
            entry_point: form_login 
            

    access_control:
        - path: ^/admin
          roles: ROLE_ADMIN
        - path: ^/responsable
          roles: ROLE_RESPONSABLE
        - path: ^/agent
          roles: ROLE_AGENT
        - path: ^/login
          roles: PUBLIC_ACCESS
        - path: ^/logout
          roles: PUBLIC_ACCESS
        
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10